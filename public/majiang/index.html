<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>国标麻将算番器 · bryan.wtf</title>
<meta name="description" content="Chinese Official (MCR) mahjong fan calculator. Enter your hand, see the fans." />
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#232b36; --ink:#e6edf3; --dim:#8b949e;
    --accent:#3b82f6; --good:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif}
  body{padding:14px 14px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin:-14px -14px 10px;padding:11px 14px;background:rgba(13,17,23,.93);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header .live{display:flex;align-items:baseline;gap:3px}
  header .live b{font-size:19px;font-weight:700;letter-spacing:-.02em}
  header .live span{font-size:11px;color:var(--dim)}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.02em}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .grid{display:grid;gap:4px}
  .tile{appearance:none;border:0;padding:0;cursor:pointer;display:block;line-height:0;border-radius:6px;
    background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.55);overflow:hidden;
    transition:transform .06s ease, filter .12s ease}
  .tile svg,.tile img{width:100%;height:auto;display:block;border-radius:6px}
  .tile:active{transform:translateY(1px) scale(.96)}
  .tile.on{filter:drop-shadow(0 0 1.5px var(--accent)) drop-shadow(0 0 3px rgba(59,130,246,.85))}
  .tile:disabled{opacity:.3}
  .hand{display:flex;flex-wrap:wrap;gap:5px;min-height:56px;align-items:flex-start;justify-content:flex-end}
  .chip{position:relative;appearance:none;border:0;padding:0;cursor:pointer;width:46px;line-height:0;border-radius:5px;
    background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.5);overflow:hidden}
  .chip svg,.chip img{width:100%;height:auto;border-radius:5px;display:block}
  .chip.win{filter:drop-shadow(0 0 1px var(--warn)) drop-shadow(0 0 4px rgba(245,158,11,.9))}
  .chip.picking{filter:drop-shadow(0 0 1px var(--accent)) drop-shadow(0 0 3px rgba(59,130,246,.8));cursor:crosshair}
  .meld{display:flex;gap:3px;align-items:center;background:#111820;border:1px solid var(--line);
    border-radius:9px;padding:5px 7px}
  .meld .tag{font-size:10px;color:var(--dim);margin-right:3px}
  .meld .mt{width:26px;line-height:0;padding:0;border-radius:3px;background:#fff;overflow:hidden}
  .meld .mt svg,.meld .mt img{width:100%;height:auto;border-radius:3px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button.b{appearance:none;border:1px solid var(--line);background:#0f141b;color:var(--ink);
    border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;cursor:pointer}
  button.b:active{transform:scale(.97)}
  button.b.ghost{color:var(--dim)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 10px;
    border:1px solid var(--line);border-radius:9px;background:#0f141b;cursor:pointer}
  .toggle input{appearance:none;width:16px;height:16px;border:1px solid #3d4757;border-radius:5px;margin:0;position:relative}
  .toggle input:checked{background:var(--accent);border-color:var(--accent)}
  .toggle input:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .seg button{appearance:none;border:1px solid var(--line);background:#0f141b;color:var(--dim);
    border-radius:9px;padding:10px 0;font-size:14px;font-family:inherit;cursor:pointer}
  .seg button.on{background:rgba(59,130,246,.16);border-color:var(--accent);color:var(--ink);font-weight:600}
  .total{display:flex;align-items:baseline;gap:10px}
  .total .n{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .total .u{font-size:13px;color:var(--dim)}
  .verdict{font-size:12px;margin-top:6px}
  .verdict.ok{color:var(--good)} .verdict.no{color:var(--warn)}
  .fans{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13px}
  .fans li{display:contents}
  .fans .name{color:var(--ink)} .fans .val{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
  .hint{font-size:11.5px;color:var(--dim);line-height:1.5;margin:2px 0 0}
  .count{font-size:11px;color:var(--dim)}
  .stepper{display:flex;align-items:center;gap:8px}
  .wait{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;
    cursor:pointer;width:52px;line-height:0}
  .wait img,.wait svg{width:44px;height:auto;border-radius:5px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.5)}
  .wait b{font-size:12px;font-weight:600;color:var(--ink);line-height:1}
  .wait span{font-size:10px;color:var(--dim);line-height:1}
  .wait.low b{color:var(--warn)}
  .modal{position:fixed;inset:0;background:rgba(3,6,10,.72);display:flex;align-items:flex-end;z-index:20}
  .modal .sheet{width:100%;max-width:560px;margin:0 auto;background:var(--panel);
    border:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
  .modal h2{font-size:14px;margin:0 0 10px;font-weight:600}
  .hidden{display:none}
  footer{color:var(--dim);font-size:11px;text-align:center;margin-top:6px}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>国标麻将算番</h1>
  <span class="live"><b id="liveTotal">0</b><span>番</span></span>
</header>

<section class="card">
  <p class="label">牌</p>
  <div id="palette"></div>
</section>

<section class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <p class="label" style="margin:0">手牌 <span class="count" id="count">0 / 14</span></p>
    <div class="row" style="gap:6px">
      <button class="b ghost" id="copy">复制</button>
      <button class="b ghost" id="winMode">和牌张</button>
      <button class="b ghost" id="undo">撤回</button>
      <button class="b ghost" id="clear">清空</button>
    </div>
  </div>
  <div class="hand" id="hand"></div>
  <p class="hint" id="hint">点牌加入手牌，手牌按万筒条字自动排序。点手牌里的牌放回去。</p>
</section>

<section class="card hidden" id="tenpaiCard">
  <p class="label">听牌 <span class="count" id="tenpaiCount"></span></p>
  <div class="row" id="tenpai"></div>
  <p class="hint">每张牌算出的番不同，点一张直接看结果。</p>
</section>

<section class="card">
  <p class="label">副露</p>
  <div class="row" id="meldButtons">
    <button class="b" data-meld="chi">吃</button>
    <button class="b" data-meld="pon">碰</button>
    <button class="b" data-meld="minkan">明杠</button>
    <button class="b" data-meld="ankan">暗杠</button>
  </div>
  <div class="row" id="melds" style="margin-top:8px"></div>
</section>

<section class="card">
  <p class="label">条件</p>
  <div class="row" style="margin-bottom:10px">
    <label class="toggle"><input type="checkbox" id="selfDraw">自摸</label>
    <label class="toggle"><input type="checkbox" id="afterKong">杠上开花</label>
    <label class="toggle"><input type="checkbox" id="lastDiscard">海底捞月</label>
    <label class="toggle"><input type="checkbox" id="lastCopy">和绝张</label>
    <label class="toggle"><input type="checkbox" id="quanQiuRen">全求人</label>
  </div>
  <p class="label" style="margin:12px 0 6px">圈风</p>
  <div class="seg" id="roundSeg">
    <button data-wind="27">东</button><button data-wind="28">南</button>
    <button data-wind="29">西</button><button data-wind="30">北</button>
  </div>
  <p class="label" style="margin:12px 0 6px">门风</p>
  <div class="seg" id="seatSeg">
    <button data-wind="27">东</button><button data-wind="28">南</button>
    <button data-wind="29">西</button><button data-wind="30">北</button>
  </div>
  <div class="row" style="margin-top:12px">
    <label class="toggle"><input type="checkbox" id="flowersOn" checked>花牌</label>
    <span class="stepper">
      <button class="b" id="fminus">−</button><span id="fcount" class="count">0</span><button class="b" id="fplus">+</button>
    </span>
  </div>
</section>

<section class="card">
  <p class="label">结果</p>
  <div class="total"><span class="n" id="total">0</span><span class="u">番</span></div>
  <div class="verdict" id="verdict"></div>
  <ul class="fans" id="fans"></ul>
</section>

<footer>按 1998 年国标规则计算 · 牌面 <a href="https://commons.wikimedia.org/wiki/File:Mahjong_1m.svg">蔡蜜</a> CC BY-SA 4.0 · <a href="https://www.bryan.wtf">bryan.wtf</a></footer>

<div class="modal hidden" id="modal">
  <div class="sheet">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="row" style="margin-top:12px">
      <button class="b ghost" id="modalCancel">取消</button>
    </div>
  </div>
</div>

<script src="./scorer.js"></script>
<script>
(function () {
  const NAMES = MJ.NAMES;
  const HONOR_TEXT = {27:'東',28:'南',29:'西',30:'北',31:'中',32:'發',33:'白'};
  const NUM = ['一','二','三','四','五','六','七','八','九'];
  const RED = '#c0392b', GREEN = '#1f7a4d', BLUE = '#1e5aa8', NAVY = '#16305c';
  // Tile art by 蔡蜜, Wikimedia Commons, CC BY-SA 4.0.
  const TILE_FILES = [
    'm1','m2','m3','m4','m5','m6','m7','m8','m9',
    'p1','p2','p3','p4','p5','p6','p7','p8','p9',
    's1','s2','s3','s4','s5','s6','s7','s8','s9',
    'east','south','west','north','green','red','white',
  ];

  /* ---------------- tile art, Chinese set ---------------- */
  // 300 x 400 canvas; the cream body comes from CSS, this draws only the face.
  const DOT_SLOTS = {
    1: [[150,200]],
    2: [[150,115],[150,285]],
    3: [[88,105],[150,200],[212,295]],
    4: [[92,115],[208,115],[92,285],[208,285]],
    5: [[92,115],[208,115],[150,200],[92,285],[208,285]],
    6: [[92,100],[208,100],[92,200],[208,200],[92,300],[208,300]],
    7: [[150,80],[92,170],[208,170],[92,255],[208,255],[92,340],[208,340]],
    8: [[92,80],[208,80],[92,170],[208,170],[92,260],[208,260],[92,350],[208,350]],
    9: [[85,85],[150,85],[215,85],[85,200],[150,200],[215,200],[85,315],[150,315],[215,315]],
  };
  const STICK_SLOTS = {
    1: [[150,200]],
    2: [[150,120],[150,280]],
    3: [[150,95],[95,290],[205,290]],
    4: [[95,120],[205,120],[95,280],[205,280]],
    5: [[95,100],[205,100],[150,200],[95,300],[205,300]],
    6: [[95,100],[150,100],[205,100],[95,285],[150,285],[205,285]],
    7: [[150,75],[95,165],[150,165],[205,165],[95,300],[150,300],[205,300]],
    8: [[95,80],[205,80],[95,170],[205,170],[95,260],[205,260],[95,350],[205,350]],
    9: [[85,85],[150,85],[215,85],[85,200],[150,200],[215,200],[85,315],[150,315],[215,315]],
  };
  const CYCLE = [RED, GREEN, BLUE];

  function dot(x, y, r, color) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '"/>'
      + '<circle cx="' + x + '" cy="' + y + '" r="' + (r * 0.58).toFixed(1) + '" fill="#f8f3e6"/>'
      + '<circle cx="' + x + '" cy="' + y + '" r="' + (r * 0.26).toFixed(1) + '" fill="' + color + '"/>';
  }

  function stick(x, y, w, h, color, joints) {
    let s = '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h
      + '" rx="' + (w / 2) + '" fill="' + color + '"/>';
    s += '<rect x="' + (x - w * 0.22) + '" y="' + (y - h / 2 + 4) + '" width="' + (w * 0.22)
      + '" height="' + (h - 8) + '" rx="' + (w * 0.11) + '" fill="#ffffff" opacity=".28"/>';
    for (let i = 1; i <= joints; i++) {
      const jy = y - h / 2 + (h * i) / (joints + 1);
      s += '<rect x="' + (x - w / 2) + '" y="' + (jy - 2) + '" width="' + w + '" height="4" fill="#f8f3e6"/>';
    }
    return s;
  }

  function tileSVG(t) {
    if (t === 33) {
      return '<svg viewBox="0 0 45 60" role="img" aria-label="白板">'
        + '<rect width="45" height="60" fill="#fff"/>'
        + '<rect x="4.5" y="5.5" width="36" height="49" rx="2" fill="none" stroke="' + GREEN + '" stroke-width="2.4"/>'
        + '<rect x="8.5" y="9.5" width="28" height="41" rx="1.5" fill="none" stroke="' + RED + '" stroke-width="1.6"/>'
        + '</svg>';
    }
    return '<img src="./tiles/' + TILE_FILES[t] + '.svg" alt="' + NAMES[t] + '" loading="lazy" draggable="false">';
  }

  function tileFaceLegacy(t) {
    let body = '';
    if (t < 9) {
      body = '<text x="150" y="168" text-anchor="middle" font-size="150" font-weight="600" fill="' + NAVY + '"'
        + ' font-family="Songti SC, STSong, SimSun, serif">' + NUM[t] + '</text>'
        + '<text x="150" y="330" text-anchor="middle" font-size="150" font-weight="600" fill="' + RED + '"'
        + ' font-family="Songti SC, STSong, SimSun, serif">萬</text>';
    } else if (t < 18) {
      const n = t - 8;
      const pts = DOT_SLOTS[n];
      if (n === 1) {
        body = '<circle cx="150" cy="200" r="94" fill="' + RED + '"/>'
          + '<circle cx="150" cy="200" r="74" fill="#f8f3e6"/>'
          + '<circle cx="150" cy="200" r="54" fill="' + GREEN + '"/>'
          + '<circle cx="150" cy="200" r="33" fill="#f8f3e6"/>'
          + '<circle cx="150" cy="200" r="15" fill="' + RED + '"/>';
      } else {
        const r = n <= 4 ? 46 : n <= 6 ? 38 : 32;
        body = pts.map(([x, y], i) => dot(x, y, r, CYCLE[(i + n) % 3])).join('');
      }
    } else if (t < 27) {
      const n = t - 17;
      const pts = STICK_SLOTS[n];
      if (n === 1) {
        body = stick(150, 230, 40, 260, GREEN, 3)
          + '<ellipse cx="104" cy="110" rx="40" ry="17" fill="' + GREEN + '" transform="rotate(-30 104 110)"/>'
          + '<ellipse cx="196" cy="110" rx="40" ry="17" fill="' + GREEN + '" transform="rotate(30 196 110)"/>'
          + '<rect x="138" y="62" width="24" height="26" rx="7" fill="' + RED + '"/>';
      } else {
        const w = n >= 7 ? 30 : 34;
        const h = n <= 3 ? 118 : n <= 6 ? 94 : 80;
        body = pts.map(([x, y], i) => stick(x, y, w, h, (n === 5 && i === 2) ? RED : GREEN, 2)).join('');
      }
    } else if (t === 33) {
      body = '<rect x="46" y="58" width="208" height="284" rx="10" fill="none" stroke="' + BLUE + '" stroke-width="16"/>'
        + '<rect x="76" y="88" width="148" height="224" rx="6" fill="none" stroke="' + BLUE + '" stroke-width="7"/>';
    } else {
      const color = t === 31 ? RED : t === 32 ? GREEN : NAVY;
      body = '<text x="150" y="305" text-anchor="middle" font-size="230" font-weight="600" fill="' + color + '"'
        + ' font-family="Songti SC, STSong, SimSun, serif">' + HONOR_TEXT[t] + '</text>';
    }
    return '<svg viewBox="0 0 300 400" role="img" aria-label="' + NAMES[t] + '">' + body + '</svg>';
  }
  const face = (t, cls) => '<span class="' + (cls || 'mt') + '">' + tileSVG(t) + '</span>';

  /* ---------------- state ---------------- */
  const state = { counts: new Array(34).fill(0), order: [], melds: [], winTile: null, flowers: 0, pickWin: false, roundWind: 27, seatWind: 27 };
  const $ = (id) => document.getElementById(id);
  const isKong = (k) => k === 'kan' || k === 'minkan' || k === 'ankan';

  const totalTiles = () => state.counts.reduce((a, b) => a + b, 0)
    + state.melds.reduce((a, m) => a + (isKong(m.kind) ? 4 : 3), 0);

  function tileCount(t) {
    let n = state.counts[t];
    for (const m of state.melds) {
      const tiles = m.kind === 'chi' ? [m.t, m.t + 1, m.t + 2] : [m.t, m.t, m.t, m.t];
      n += tiles.filter((x) => x === t).length;
    }
    return n;
  }

  /* ---------------- palette ---------------- */
  function renderPalette() {
    const pal = $('palette');
    pal.innerHTML = '';
    for (let row = 0; row < 4; row++) {
      const g = document.createElement('div');
      g.className = 'grid';
      g.style.marginBottom = row < 3 ? '6px' : '0';
      g.style.gridTemplateColumns = 'repeat(9,1fr)';
      g.style.gap = '4px';
      const from = row < 3 ? row * 9 : 27;
      const to = row < 3 ? from + 9 : 34;
      for (let t = from; t < to; t++) {
        const b = document.createElement('button');
        b.className = 'tile';
        b.dataset.t = t;
        b.innerHTML = tileSVG(t);
        b.setAttribute('aria-label', NAMES[t]);
        b.onclick = () => addTile(t);
        g.appendChild(b);
      }
      pal.appendChild(g);
    }
  }

  function syncPalette() {
    for (const b of document.querySelectorAll('#palette .tile')) {
      const t = +b.dataset.t;
      b.classList.toggle('on', state.counts[t] > 0);
      b.disabled = tileCount(t) >= 4;
    }
    $('count').textContent = totalTiles() + ' / 14';
  }

  function addTile(t) {
    if (tileCount(t) >= 4) return;
    const kongs = state.melds.filter((m) => isKong(m.kind)).length;
    if (totalTiles() >= 14 + kongs) return;
    state.counts[t]++;
    state.order.push(t);
    state.winTile = t;
    render();
  }

  function removeTile(t) {
    if (!state.counts[t]) return;
    state.counts[t]--;
    const i = state.order.lastIndexOf(t);
    if (i >= 0) state.order.splice(i, 1);
    if (state.winTile === t && state.counts[t] === 0) {
      state.winTile = state.order.length ? state.order[state.order.length - 1] : null;
    }
    render();
  }

  /* ---------------- hand: entry order, newest on the right ---------------- */
  function renderHand() {
    const hand = $('hand');
    hand.innerHTML = '';
    const tiles = [];
    for (let t = 0; t < 34; t++) for (let i = 0; i < state.counts[t]; i++) tiles.push(t);
    if (!tiles.length) {
      hand.innerHTML = '<span class="hint">还没有牌。</span>';
      return;
    }
    let prevSuit = -1;
    tiles.forEach((t) => {
      const wrap = document.createElement('button');
      const suit = t < 27 ? Math.floor(t / 9) : 3;
      wrap.className = 'chip' + (state.winTile === t ? ' win' : '')
        + (state.pickWin ? ' picking' : '');
      if (prevSuit !== -1 && suit !== prevSuit) wrap.style.marginLeft = '7px';
      prevSuit = suit;
      wrap.innerHTML = tileSVG(t);
      wrap.title = NAMES[t];
      wrap.setAttribute('aria-label', state.pickWin ? '设为和牌张 ' + NAMES[t] : '放回 ' + NAMES[t]);
      wrap.onclick = () => {
        if (state.pickWin) {
          state.winTile = t;
          state.pickWin = false;
          render();
        } else {
          removeTile(t);
        }
      };
      hand.appendChild(wrap);
    });
  }

  function renderMelds() {
    const box = $('melds');
    box.innerHTML = '';
    if (!state.melds.length) {
      box.innerHTML = '<span class="hint">没有副露，点副露块可删除。</span>';
      return;
    }
    state.melds.forEach((m, idx) => {
      const d = document.createElement('div');
      d.className = 'meld';
      const label = m.kind === 'chi' ? '吃' : m.kind === 'pon' ? '碰' : m.kind === 'ankan' ? '暗杠' : '明杠';
      const tiles = m.kind === 'chi' ? [m.t, m.t + 1, m.t + 2] : [m.t, m.t, m.t, m.t];
      d.innerHTML = '<span class="tag">' + label + '</span>' + tiles.map((t) => face(t)).join('');
      d.onclick = () => { state.melds.splice(idx, 1); render(); };
      box.appendChild(d);
    });
  }

  /* ---------------- result ---------------- */
  function renderResult() {
    const melds = state.melds.map((m) => ({
      kind: m.kind === 'chi' ? 'chi' : m.kind === 'pon' ? 'pon' : 'kan',
      t: m.t,
      open: m.kind !== 'ankan',
    }));
    const res = MJ.score({
      counts: state.counts,
      melds,
      winTile: state.winTile,
      selfDraw: $('selfDraw').checked,
      afterKong: $('afterKong').checked,
      lastDiscard: $('lastDiscard').checked,
      lastCopy: $('lastCopy').checked,
      quanQiuRen: $('quanQiuRen').checked,
      roundWind: state.roundWind,
      seatWind: state.seatWind,
      flowers: state.flowers,
      flowersEnabled: $('flowersOn').checked,
    });
    $('total').textContent = res.total;
    $('liveTotal').textContent = res.total;
    const v = $('verdict');
    v.className = 'verdict ' + (res.valid ? 'ok' : 'no');
    v.textContent = res.valid ? '可以和，' + res.total + ' 番' : (res.reason || '还不能和');
    const list = $('fans');
    list.innerHTML = '';
    if (!res.fans.length) {
      list.innerHTML = '<li class="hint">' + (res.reason || '输入 14 张牌后显示番种。') + '</li>';
      return;
    }
    for (const f of res.fans) {
      const li = document.createElement('li');
      li.innerHTML = '<span class="name">' + f.name + '</span><span class="val">' + f.fan + '</span>';
      list.appendChild(li);
    }
  }

  function renderTenpai() {
    const card = $('tenpaiCard');
    const box = $('tenpai');
    const kongs = state.melds.filter((m) => isKong(m.kind)).length;
    const need = 14 + kongs;
    if (totalTiles() !== need - 1) { card.classList.add('hidden'); return; }
    const melds = state.melds.map((m) => ({
      kind: m.kind === 'chi' ? 'chi' : m.kind === 'pon' ? 'pon' : 'kan',
      t: m.t,
      open: m.kind !== 'ankan',
    }));
    const waits = [];
    for (let t = 0; t < 34; t++) {
      if (tileCount(t) >= 4) continue;
      const c = state.counts.slice();
      c[t]++;
      const res = MJ.score({
        counts: c, melds, winTile: t,
        selfDraw: $('selfDraw').checked,
        afterKong: $('afterKong').checked,
        lastDiscard: $('lastDiscard').checked,
        lastCopy: $('lastCopy').checked,
        quanQiuRen: $('quanQiuRen').checked,
        roundWind: state.roundWind,
        seatWind: state.seatWind,
        flowers: state.flowers,
        flowersEnabled: $('flowersOn').checked,
      });
      if (res.fans.length && res.total > 0) waits.push({ t, total: res.total, valid: res.valid });
    }
    if (!waits.length) {
      card.classList.remove('hidden');
      $('tenpaiCount').textContent = '还没听';
      box.innerHTML = '<span class="hint">这一手还没有能和牌的牌。</span>';
      return;
    }
    waits.sort((a, b) => b.total - a.total);
    card.classList.remove('hidden');
    $('tenpaiCount').textContent = waits.length + ' 种';
    box.innerHTML = '';
    for (const w of waits) {
      const b = document.createElement('button');
      b.className = 'wait' + (w.valid ? '' : ' low');
      b.innerHTML = tileSVG(w.t) + '<b>' + w.total + ' 番</b>'
        + (w.valid ? '' : '<span>不足 8</span>');
      b.title = NAMES[w.t];
      b.onclick = () => {
        state.counts[w.t]++;
        state.order.push(w.t);
        state.winTile = w.t;
        render();
      };
      box.appendChild(b);
    }
  }

  function renderHint() {
    const kongs = state.melds.filter((m) => isKong(m.kind)).length;
    const need = 14 + kongs - totalTiles();
    const el = $('hint');
    if (state.pickWin) { el.textContent = '点手牌里的一张，把它设为和牌张。'; return; }
    if (need > 0) el.textContent = '还差 ' + need + ' 张。点牌加入，点手牌放回去。';
    else if (need === 0) el.textContent = '牌数齐了。橙框是和牌张，点「和牌张」可改。';
    else el.textContent = '多出 ' + (-need) + ' 张，点手牌放回去。';
  }

  function render() {
    $('winMode').textContent = state.pickWin ? '点一张' : '和牌张';
    renderHand();
    renderHint();
    renderTenpai();
    renderMelds();
    syncPalette();
    renderResult();
  }

  /* ---------------- meld picker ---------------- */
  // Only groups the hand can actually make: 碰 needs a pair, 吃 needs two of the run,
  // 明杠 needs three of a kind, 暗杠 all four.
  function meldCandidates(kind) {
    const out = [];
    if (kind === 'chi') {
      for (let t = 0; t < 27; t++) {
        if (t % 9 > 6) continue;
        const have = [t, t + 1, t + 2].filter((x) => state.counts[x] > 0).length;
        if (have >= 2) out.push(t);
      }
      return out;
    }
    for (let t = 0; t < 34; t++) {
      const need = kind === 'pon' ? 2 : kind === 'minkan' ? 3 : 4;
      if (state.counts[t] >= need) out.push(t);
    }
    return out;
  }

  function openPicker(kind) {
    const title = {
      chi: '吃：手里有两张顺子，选最小的那张',
      pon: '碰：选手里已有的一对',
      minkan: '明杠：选手里已有的三张',
      ankan: '暗杠：选手里已有的四张',
    }[kind];
    const body = $('modalBody');
    body.innerHTML = '';
    const cands = meldCandidates(kind);
    if (!cands.length) {
      $('modalTitle').textContent = title;
      body.innerHTML = '<p class="hint">手里没有可以' + { chi: '吃的搭子', pon: '碰的对子',
        minkan: '杠的三张', ankan: '杠的四张' }[kind] + '。先把牌加进手牌。</p>';
      $('modal').classList.remove('hidden');
      return;
    }
    $('modalTitle').textContent = title;
    const g = document.createElement('div');
    g.className = 'grid';
    g.style.gridTemplateColumns = 'repeat(7,1fr)';
    g.style.gap = '6px';
    for (const t of cands) {
      const b = document.createElement('button');
      b.className = 'tile';
      b.innerHTML = tileSVG(t) + '<span style="display:block;font-size:10px;color:#8b949e;line-height:1.4">'
        + (kind === 'chi' ? [t, t + 1, t + 2].map((x) => NAMES[x][0]).join('') : '') + '</span>';
      b.onclick = () => { closePicker(); applyMeld(kind, t); };
      g.appendChild(b);
    }
    body.appendChild(g);
    $('modal').classList.remove('hidden');
  }
  function closePicker() { $('modal').classList.add('hidden'); }
  $('modalCancel').onclick = closePicker;
  $('modal').onclick = (e) => { if (e.target.id === 'modal') closePicker(); };

  function takeFromHand(t, n) {
    for (let i = 0; i < n; i++) {
      if (!state.counts[t]) return false;
      state.counts[t]--;
      const idx = state.order.lastIndexOf(t);
      if (idx >= 0) state.order.splice(idx, 1);
    }
    return true;
  }

  // Move the tiles out of the hand and into the meld; the claimed tile is the one
  // the meld adds, so a 碰 consumes two from hand and a 吃 consumes the two it held.
  function applyMeld(kind, t) {
    const tiles = kind === 'chi' ? [t, t + 1, t + 2] : [t, t, t, t];
    const take = kind === 'chi' || kind === 'pon' ? 2 : kind === 'minkan' ? 3 : 4;
    if (kind === 'chi') {
      // take from the two tiles the hand actually holds, leave the claimed one
      const held = [t, t + 1, t + 2].filter((x) => state.counts[x] > 0);
      if (held.length < 2) return;
      const singles = held.slice(0, 2);
      for (const x of singles) if (!takeFromHand(x, 1)) return;
    } else {
      if (!takeFromHand(t, take)) return;
    }
    state.melds.push({ kind, t, open: kind !== 'ankan' });
    if (state.winTile !== null && !state.counts[state.winTile]) {
      state.winTile = state.order.length ? state.order[state.order.length - 1] : null;
    }
    render();
  }

  /* ---------------- controls ---------------- */
  $('undo').onclick = () => {
    const t = state.order.pop();
    if (t !== undefined) {
      state.counts[t]--;
      if (state.winTile === t && state.counts[t] === 0) {
        state.winTile = state.order.length ? state.order[state.order.length - 1] : null;
      }
    }
    render();
  };
  $('clear').onclick = () => {
    state.counts = new Array(34).fill(0);
    state.order = [];
    state.melds = [];
    state.winTile = null;
    state.flowers = 0;
    $('fcount').textContent = '0';
    render();
  };
  $('copy').onclick = async () => {
    const group = (from, to) => {
      let s = '';
      for (let t = from; t < to; t++) for (let i = 0; i < state.counts[t]; i++) s += ((t % 9) + 1);
      return s;
    };
    const honours = [];
    for (let t = 27; t < 34; t++) for (let i = 0; i < state.counts[t]; i++) honours.push(NAMES[t][0]);
    const parts = [];
    if (group(0, 9)) parts.push(group(0, 9) + 'm');
    if (group(9, 18)) parts.push(group(9, 18) + 'p');
    if (group(18, 27)) parts.push(group(18, 27) + 's');
    if (honours.length) parts.push(honours.join(''));
    if (state.melds.length) parts.push('| 副露 ' + state.melds.map((m) => m.kind + ':' + NAMES[m.t]).join(', '));
    if (state.winTile !== null) parts.push('| 和 ' + NAMES[state.winTile]);
    const text = parts.join(' ') || '（空）';
    try {
      await navigator.clipboard.writeText(text);
      $('hint').textContent = '已复制：' + text;
    } catch (e) {
      $('hint').textContent = text;
    }
  };
  $('winMode').onclick = () => { state.pickWin = !state.pickWin; render(); };
  for (const b of document.querySelectorAll('[data-meld]')) b.onclick = () => openPicker(b.dataset.meld);
  $('fplus').onclick = () => { state.flowers = Math.min(8, state.flowers + 1); $('fcount').textContent = state.flowers; renderResult(); };
  $('fminus').onclick = () => { state.flowers = Math.max(0, state.flowers - 1); $('fcount').textContent = state.flowers; renderResult(); };
  for (const id of ['selfDraw', 'afterKong', 'lastDiscard', 'lastCopy', 'quanQiuRen', 'flowersOn']) {
    $(id).addEventListener('change', renderResult);
  }
  function wireSeg(el, key) {
    for (const b of el.querySelectorAll('button')) {
      b.onclick = () => {
        state[key] = +b.dataset.wind;
        paintSegs();
        render();
      };
    }
  }
  function paintSegs() {
    for (const b of document.querySelectorAll('#roundSeg button')) b.classList.toggle('on', +b.dataset.wind === state.roundWind);
    for (const b of document.querySelectorAll('#seatSeg button')) b.classList.toggle('on', +b.dataset.wind === state.seatWind);
  }
  wireSeg($('roundSeg'), 'roundWind');
  wireSeg($('seatSeg'), 'seatWind');
  paintSegs();

  renderPalette();
  render();
})();
</script>
</body>
</html>
