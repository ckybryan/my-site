<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>国标麻将算番器 · bryan.wtf</title>
<meta name="description" content="Chinese Official (MCR) mahjong fan calculator. Enter your hand, see the fans." />
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#232b36; --ink:#e6edf3; --dim:#8b949e;
    --accent:#3b82f6; --good:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif}
  body{padding:14px 14px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin:-14px -14px 10px;padding:11px 14px;background:rgba(13,17,23,.93);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  header .live{display:flex;align-items:baseline;gap:3px}
  header .live b{font-size:19px;font-weight:700;letter-spacing:-.02em}
  header .live span{font-size:11px;color:var(--dim)}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.02em}
  .sub{font-size:12px;color:var(--dim)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .grid{display:grid;gap:4px}
  .tile{appearance:none;border:0;padding:4%;cursor:pointer;display:block;line-height:0;border-radius:7px;
    background:linear-gradient(#fcf8ee,#e7dfc9);box-shadow:0 2px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.55);
    transition:transform .06s ease, filter .12s ease}
  .tile svg,.tile img{width:100%;height:auto;display:block;border-radius:6px}

  .tile:active{transform:translateY(1px) scale(.96)}
  .tile.on{filter:drop-shadow(0 0 1.5px var(--accent)) drop-shadow(0 0 3px rgba(59,130,246,.85))}
  .tile:disabled{opacity:.3}
  .hand{display:flex;flex-wrap:wrap;gap:5px;min-height:56px;align-items:flex-start}
  .chip{position:relative;appearance:none;border:0;padding:3%;cursor:pointer;width:46px;line-height:0;border-radius:6px;
    background:linear-gradient(#fcf8ee,#e7dfc9);box-shadow:0 2px 3px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.5)}
  .chip .rm{position:absolute;top:-5px;right:-5px;width:19px;height:19px;border-radius:50%;padding:0;
    border:1px solid #3a4655;background:#222c38;color:#cbd5e1;font-size:12px;line-height:15px;
    font-family:inherit;opacity:.9}
  .chip .rm:active{background:#39465a}
  .chip svg,.chip img{width:100%;height:auto;border-radius:5px;display:block}

  .chip.win{filter:drop-shadow(0 0 1px var(--warn)) drop-shadow(0 0 4px rgba(245,158,11,.9))}
  .chip.picking{filter:drop-shadow(0 0 1px var(--accent)) drop-shadow(0 0 3px rgba(59,130,246,.8));cursor:crosshair}
  .meld{display:flex;gap:3px;align-items:center;background:#111820;border:1px solid var(--line);
    border-radius:9px;padding:5px 7px}
  .meld .tag{font-size:10px;color:var(--dim);margin-right:3px}
  .meld .mt{width:26px;line-height:0;padding:1px;border-radius:4px;background:linear-gradient(#fcf8ee,#e7dfc9)}
  .meld .mt svg,.meld .mt img{width:100%;height:auto;border-radius:3px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button.b{appearance:none;border:1px solid var(--line);background:#0f141b;color:var(--ink);
    border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;cursor:pointer}
  button.b:active{transform:scale(.97)}
  button.b.ghost{color:var(--dim)}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 10px;
    border:1px solid var(--line);border-radius:9px;background:#0f141b;cursor:pointer}
  .toggle input{appearance:none;width:16px;height:16px;border:1px solid #3d4757;border-radius:5px;margin:0;position:relative}
  .toggle input:checked{background:var(--accent);border-color:var(--accent)}
  .toggle input:checked::after{content:"";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
  select{appearance:none;background:#0f141b;color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:9px 10px;font-size:13px;font-family:inherit}
  .total{display:flex;align-items:baseline;gap:10px}
  .total .n{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .total .u{font-size:13px;color:var(--dim)}
  .verdict{font-size:12px;margin-top:6px}
  .verdict.ok{color:var(--good)} .verdict.no{color:var(--warn)}
  .fans{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:13px}
  .fans li{display:contents}
  .fans .name{color:var(--ink)} .fans .val{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
  .hint{font-size:11.5px;color:var(--dim);line-height:1.5;margin:2px 0 0}
  .count{font-size:11px;color:var(--dim)}
  .stepper{display:flex;align-items:center;gap:8px}
  .modal{position:fixed;inset:0;background:rgba(3,6,10,.72);display:flex;align-items:flex-end;z-index:20}
  .modal .sheet{width:100%;max-width:560px;margin:0 auto;background:var(--panel);
    border:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
  .modal h2{font-size:14px;margin:0 0 10px;font-weight:600}
  .hidden{display:none}
  footer{color:var(--dim);font-size:11px;text-align:center;margin-top:6px}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>国标麻将算番</h1>
  <span class="live"><b id="liveTotal">0</b><span>番</span></span>
</header>

<section class="card">
  <p class="label">牌</p>
  <div id="palette"></div>
</section>

<section class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <p class="label" style="margin:0">手牌 <span class="count" id="count">0 / 14</span></p>
    <div class="row" style="gap:6px">
      <button class="b ghost" id="winMode">和牌张</button>
      <button class="b ghost" id="undo">撤回</button>
      <button class="b ghost" id="clear">清空</button>
    </div>
  </div>
  <div class="hand" id="hand"></div>
  <p class="hint" id="hint">点牌加入手牌，点手牌里的牌设为和牌张，再点一次取消。</p>
</section>

<section class="card">
  <p class="label">副露</p>
  <div class="row" id="meldButtons">
    <button class="b" data-meld="chi">吃</button>
    <button class="b" data-meld="pon">碰</button>
    <button class="b" data-meld="minkan">明杠</button>
    <button class="b" data-meld="ankan">暗杠</button>
  </div>
  <div class="row" id="melds" style="margin-top:8px"></div>
</section>

<section class="card">
  <p class="label">条件</p>
  <div class="row" style="margin-bottom:10px">
    <label class="toggle"><input type="checkbox" id="selfDraw">自摸</label>
    <label class="toggle"><input type="checkbox" id="afterKong">杠上开花</label>
    <label class="toggle"><input type="checkbox" id="lastDiscard">海底捞月</label>
    <label class="toggle"><input type="checkbox" id="lastCopy">和绝张</label>
  </div>
  <div class="row">
    <select id="roundWind">
      <option value="27">东风圈</option><option value="28">南风圈</option>
      <option value="29">西风圈</option><option value="30">北风圈</option>
    </select>
    <select id="seatWind">
      <option value="27">东风位</option><option value="28">南风位</option>
      <option value="29">西风位</option><option value="30">北风位</option>
    </select>
    <label class="toggle"><input type="checkbox" id="flowersOn" checked>花牌</label>
    <span class="stepper">
      <button class="b" id="fminus">−</button><span id="fcount" class="count">0</span><button class="b" id="fplus">+</button>
    </span>
  </div>
</section>

<section class="card">
  <p class="label">结果</p>
  <div class="total"><span class="n" id="total">0</span><span class="u">番</span></div>
  <div class="verdict" id="verdict"></div>
  <ul class="fans" id="fans"></ul>
</section>

<footer>按 1998 年国标规则计算 · 牌面 <a href="https://github.com/FluffyStuff/riichi-mahjong-tiles">FluffyStuff</a> CC0 · <a href="https://www.bryan.wtf">bryan.wtf</a></footer>

<div class="modal hidden" id="modal">
  <div class="sheet">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="row" style="margin-top:12px">
      <button class="b ghost" id="modalCancel">取消</button>
    </div>
  </div>
</div>

<script src="./scorer.js"></script>
<script>
(function () {
  const NAMES = MJ.NAMES;
  const HONOR_TEXT = {27:'東',28:'南',29:'西',30:'北',31:'中',32:'發',33:'白'};
  const NUM = ['一','二','三','四','五','六','七','八','九'];

  /* ---------------- tile art ---------------- */
  const DOT_LAYOUT = {
    1: [[20,26]],
    2: [[20,16],[20,36]],
    3: [[13,14],[20,26],[27,38]],
    4: [[13,16],[27,16],[13,36],[27,36]],
    5: [[13,16],[27,16],[20,26],[13,36],[27,36]],
    6: [[13,14],[27,14],[13,26],[27,26],[13,38],[27,38]],
    7: [[20,10],[13,21],[27,21],[13,32],[27,32],[13,43],[27,43]],
    8: [[13,10],[27,10],[13,21],[27,21],[13,32],[27,32],[13,43],[27,43]],
    9: [[13,11],[20,11],[27,11],[13,26],[20,26],[27,26],[13,41],[20,41],[27,41]],
  };
  const STICK_LAYOUT = {
    1: [[20,26]],
    2: [[20,15],[20,37]],
    3: [[20,12],[14,37],[26,37]],
    4: [[14,15],[26,15],[14,37],[26,37]],
    5: [[14,12],[26,12],[20,26],[14,40],[26,40]],
    6: [[14,13],[26,13],[14,26],[26,26],[14,39],[26,39]],
    7: [[20,9],[14,21],[26,21],[14,33],[26,33],[14,45],[26,45]],
    8: [[14,10],[26,10],[14,21],[26,21],[14,32],[26,32],[14,43],[26,43]],
    9: [[12,12],[20,12],[28,12],[12,26],[20,26],[28,26],[12,40],[20,40],[28,40]],
  };
  const DOT_COLORS = ['#1e5aa8', '#c8392f', '#1f7a4d'];

  const TILE_FILES = [
    'Man1','Man2','Man3','Man4','Man5','Man6','Man7','Man8','Man9',
    'Pin1','Pin2','Pin3','Pin4','Pin5','Pin6','Pin7','Pin8','Pin9',
    'Sou1','Sou2','Sou3','Sou4','Sou5','Sou6','Sou7','Sou8','Sou9',
    'Ton','Nan','Shaa','Pei','Chun','Hatsu','Haku',
  ];

  // Public domain tile art (CC0) from FluffyStuff/riichi-mahjong-tiles.
  function tileSVG(t) {
    return '<img src="./tiles/' + TILE_FILES[t] + '.svg" alt="' + NAMES[t] + '" loading="lazy" draggable="false">';
  }

  function tileArtUnused(t) {
    const gid = 'g' + t;
    let body = '';
    if (t < 9) {
      body = '<text x="20" y="25" text-anchor="middle" font-size="18" font-weight="600" fill="#14305e"'
        + ' font-family="Songti SC, STSong, SimSun, serif">' + NUM[t] + '</text>'
        + '<text x="20" y="46" text-anchor="middle" font-size="18" font-weight="600" fill="#b8281f"'
        + ' font-family="Songti SC, STSong, SimSun, serif">萬</text>';
    } else if (t < 18) {
      const r = t - 9;
      const pts = DOT_LAYOUT[r + 1] || [];
      const radius = r === 0 ? 7.2 : 4.6;
      pts.forEach(([x, y], i) => {
        const c = DOT_COLORS[(i + r) % 3];
        body += '<circle cx="' + x + '" cy="' + y + '" r="' + radius + '" fill="' + c
          + '" stroke="#f8f3e6" stroke-width="1.1"/>';
        body += '<circle cx="' + (x - radius * 0.3).toFixed(1) + '" cy="' + (y - radius * 0.34).toFixed(1)
          + '" r="' + (radius * 0.26).toFixed(1) + '" fill="#fff" opacity=".55"/>';
      });
    } else if (t < 27) {
      const r = t - 18;
      const pts = STICK_LAYOUT[r + 1] || [];
      const w = r === 0 ? 8 : (r + 1 === 9 ? 3.9 : 4.8);
      const h = r === 0 ? 27 : 8.2;
      pts.forEach(([x, y], i) => {
        const c = r === 0 ? '#1f7a4d' : (i % 5 === 4 ? '#c8392f' : '#1f7a4d');
        body += '<rect x="' + (x - w / 2).toFixed(1) + '" y="' + (y - h / 2).toFixed(1) + '" width="' + w
          + '" height="' + h + '" rx="' + (w / 2).toFixed(1) + '" fill="' + c + '" stroke="#f8f3e6" stroke-width=".9"/>';
        body += '<rect x="' + (x - w / 2 + w * 0.28).toFixed(1) + '" y="' + (y - h / 2 + 1).toFixed(1)
          + '" width="' + (w * 0.22).toFixed(1) + '" height="' + Math.max(2, h - 2) + '" rx="1" fill="#fff" opacity=".3"/>';
        // bamboo joints: one or two cream bands across the stick
        body += '<line x1="' + (x - w / 2).toFixed(1) + '" x2="' + (x + w / 2).toFixed(1)
          + '" y1="' + y + '" y2="' + y + '" stroke="#f8f3e6" stroke-width="1.3"/>';
        if (h > 12) {
          body += '<line x1="' + (x - w / 2).toFixed(1) + '" x2="' + (x + w / 2).toFixed(1)
            + '" y1="' + (y - h / 3).toFixed(1) + '" y2="' + (y - h / 3).toFixed(1)
            + '" stroke="#f8f3e6" stroke-width="1.1"/>';
        }
      });
      if (r === 0) body += '<path d="M20 8 l3.2 5.5 -3.2 3 -3.2 -3 z" fill="#c8392f"/>';
    } else if (t === 33) {
      body = '<rect x="8" y="10" width="24" height="34" rx="3" fill="none" stroke="#1e5aa8" stroke-width="2.2"/>'
        + '<rect x="11.5" y="13.5" width="17" height="27" rx="2" fill="none" stroke="#1e5aa8" stroke-width="1"/>';
    } else {
      const color = t === 31 ? '#b8281f' : t === 32 ? '#15703f' : '#14305e';
      body = '<text x="20" y="38" text-anchor="middle" font-size="29" font-weight="600" fill="' + color + '"'
        + ' font-family="Songti SC, STSong, SimSun, serif">' + HONOR_TEXT[t] + '</text>';
    }
    return '<svg viewBox="0 0 40 54" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + NAMES[t] + '">'
      + '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="#fcf8ee"/><stop offset="1" stop-color="#e9e1cc"/></linearGradient></defs>'
      + '<rect x=".8" y=".8" width="38.4" height="52.4" rx="5" fill="url(#' + gid + ')" stroke="#c9c0a8" stroke-width="1"/>'
      + '<rect x="3" y="3" width="34" height="48" rx="4" fill="none" stroke="#ded5bd" stroke-width=".7"/>'
      + body + '</svg>';
  }
  const face = (t, cls) => '<span class="' + (cls || 'mt') + '">' + tileSVG(t) + '</span>';

  /* ---------------- state ---------------- */
  const state = { counts: new Array(34).fill(0), order: [], melds: [], winTile: null, flowers: 0, pickWin: false };
  const $ = (id) => document.getElementById(id);
  const isKong = (k) => k === 'kan' || k === 'minkan' || k === 'ankan';

  const totalTiles = () => state.counts.reduce((a, b) => a + b, 0)
    + state.melds.reduce((a, m) => a + (isKong(m.kind) ? 4 : 3), 0);

  function tileCount(t) {
    let n = state.counts[t];
    for (const m of state.melds) {
      const tiles = m.kind === 'chi' ? [m.t, m.t + 1, m.t + 2] : [m.t, m.t, m.t, m.t];
      n += tiles.filter((x) => x === t).length;
    }
    return n;
  }

  /* ---------------- palette ---------------- */
  function renderPalette() {
    const pal = $('palette');
    pal.innerHTML = '';
    for (let row = 0; row < 4; row++) {
      const g = document.createElement('div');
      g.className = 'grid';
      g.style.marginBottom = row < 3 ? '6px' : '0';
      g.style.gridTemplateColumns = 'repeat(9,1fr)';
      g.style.gap = '4px';
      if (row === 3) {
        g.appendChild(document.createElement('span'));
        g.appendChild(document.createElement('span'));
      }
      const from = row < 3 ? row * 9 : 27;
      const to = row < 3 ? from + 9 : 34;
      for (let t = from; t < to; t++) {
        const b = document.createElement('button');
        b.className = 'tile';
        b.dataset.t = t;
        b.innerHTML = tileSVG(t);
        b.setAttribute('aria-label', NAMES[t]);
        b.onclick = () => addTile(t);
        g.appendChild(b);
      }
      pal.appendChild(g);
    }
  }

  function syncPalette() {
    const kongs = state.melds.filter((m) => isKong(m.kind)).length;
    const full = totalTiles() >= 14 + kongs;
    for (const b of document.querySelectorAll('#palette .tile')) {
      const t = +b.dataset.t;
      b.classList.toggle('on', state.counts[t] > 0);
      b.disabled = tileCount(t) >= 4;
    }
    $('count').textContent = totalTiles() + ' / 14';
  }

  function addTile(t) {
    if (tileCount(t) >= 4) return;
    const kongs = state.melds.filter((m) => isKong(m.kind)).length;
    if (totalTiles() >= 14 + kongs) return;
    state.counts[t]++;
    state.order.push(t);
    state.winTile = t;
    render();
  }

  function removeTile(t) {
    if (!state.counts[t]) return;
    state.counts[t]--;
    const i = state.order.lastIndexOf(t);
    if (i >= 0) state.order.splice(i, 1);
    if (state.winTile === t && state.counts[t] === 0) {
      state.winTile = state.order.length ? state.order[state.order.length - 1] : null;
    }
    render();
  }

  /* ---------------- hand ---------------- */
  function renderHand() {
    const hand = $('hand');
    hand.innerHTML = '';
    const tiles = [];
    for (let t = 0; t < 34; t++) for (let i = 0; i < state.counts[t]; i++) tiles.push(t);
    if (!tiles.length) {
      hand.innerHTML = '<span class="hint">还没有牌。</span>';
      return;
    }
    let prevSuit = -1;
    tiles.forEach((t) => {
      const wrap = document.createElement('button');
      wrap.className = 'chip' + (state.winTile === t ? ' win' : '')
        + (state.pickWin ? ' picking' : '');
      const s = t < 27 ? Math.floor(t / 9) : 3;
      if (prevSuit !== -1 && s !== prevSuit) wrap.style.marginLeft = '7px';
      prevSuit = s;
      wrap.innerHTML = tileSVG(t);
      wrap.title = NAMES[t];
      wrap.setAttribute('aria-label', state.pickWin ? '设为和牌张 ' + NAMES[t] : '放回 ' + NAMES[t]);
      wrap.onclick = () => {
        if (state.pickWin) {
          state.winTile = t;
          state.pickWin = false;
          render();
        } else {
          removeTile(t);
        }
      };
      hand.appendChild(wrap);
    });
  }

  function renderMelds() {
    const box = $('melds');
    box.innerHTML = '';
    if (!state.melds.length) {
      box.innerHTML = '<span class="hint">没有副露，点副露块可删除。</span>';
      return;
    }
    state.melds.forEach((m, idx) => {
      const d = document.createElement('div');
      d.className = 'meld';
      const label = m.kind === 'chi' ? '吃' : m.kind === 'pon' ? '碰' : m.kind === 'ankan' ? '暗杠' : '明杠';
      const tiles = m.kind === 'chi' ? [m.t, m.t + 1, m.t + 2] : [m.t, m.t, m.t, m.t];
      d.innerHTML = '<span class="tag">' + label + '</span>' + tiles.map((t) => face(t)).join('');
      d.onclick = () => { state.melds.splice(idx, 1); render(); };
      box.appendChild(d);
    });
  }

  /* ---------------- result ---------------- */
  function renderResult() {
    const melds = state.melds.map((m) => ({
      kind: m.kind === 'chi' ? 'chi' : m.kind === 'pon' ? 'pon' : 'kan',
      t: m.t,
      open: m.kind !== 'ankan',
    }));
    const res = MJ.score({
      counts: state.counts,
      melds,
      winTile: state.winTile,
      selfDraw: $('selfDraw').checked,
      afterKong: $('afterKong').checked,
      lastDiscard: $('lastDiscard').checked,
      lastCopy: $('lastCopy').checked,
      roundWind: +$('roundWind').value,
      seatWind: +$('seatWind').value,
      flowers: state.flowers,
      flowersEnabled: $('flowersOn').checked,
    });
    $('total').textContent = res.total;
    $('liveTotal').textContent = res.total;
    const v = $('verdict');
    v.className = 'verdict ' + (res.valid ? 'ok' : 'no');
    v.textContent = res.valid ? '可以和，' + res.total + ' 番' : (res.reason || '还不能和');
    const list = $('fans');
    list.innerHTML = '';
    if (!res.fans.length) {
      list.innerHTML = '<li class="hint">' + (res.reason || '输入 14 张牌后显示番种。') + '</li>';
      return;
    }
    for (const f of res.fans) {
      const li = document.createElement('li');
      li.innerHTML = '<span class="name">' + f.name + '</span><span class="val">' + f.fan + '</span>';
      list.appendChild(li);
    }
  }

  function renderHint() {
    const kongs = state.melds.filter((m) => isKong(m.kind)).length;
    const need = 14 + kongs - totalTiles();
    const el = $('hint');
    if (state.pickWin) { el.textContent = '点手牌里的一张，把它设为和牌张。'; return; }
    if (need > 0) el.textContent = '还差 ' + need + ' 张。点牌加入，点手牌里的牌放回去。';
    else if (need === 0) el.textContent = '牌数齐了。橙框是和牌张，点「和牌张」可改。';
    else el.textContent = '多出 ' + (-need) + ' 张，点手牌放回去。';
  }

  function render() {
    $('winMode').textContent = state.pickWin ? '点一张' : '和牌张';
    renderHand();
    renderHint();
    renderMelds();
    syncPalette();
    renderResult();
  }

  /* ---------------- meld picker ---------------- */
  function openPicker(kind) {
    $('modalTitle').textContent = { chi: '吃：选顺子里最小的一张', pon: '碰：选刻子的牌',
      minkan: '明杠：选牌', ankan: '暗杠：选牌' }[kind];
    const body = $('modalBody');
    body.innerHTML = '';
    const g = document.createElement('div');
    g.className = 'grid';
    g.style.gridTemplateColumns = 'repeat(7,1fr)';
    g.style.gap = '6px';
    for (let t = 0; t < 34; t++) {
      const ok = kind === 'chi' ? (t < 27 && (t % 9) <= 6) : true;
      const b = document.createElement('button');
      b.className = 'tile';
      b.innerHTML = tileSVG(t);
      b.disabled = !ok;
      b.onclick = () => { closePicker(); applyMeld(kind, t); };
      g.appendChild(b);
    }
    body.appendChild(g);
    $('modal').classList.remove('hidden');
  }
  function closePicker() { $('modal').classList.add('hidden'); }
  $('modalCancel').onclick = closePicker;
  $('modal').onclick = (e) => { if (e.target.id === 'modal') closePicker(); };

  function applyMeld(kind, t) {
    const need = kind === 'chi' ? [t, t + 1, t + 2] : [t, t, t, t];
    const c = state.counts.slice();
    for (const x of need) c[x] = (c[x] || 0) + 1;
    if (need.some((x) => c[x] > 4)) return;
    const kongs = state.melds.filter((m) => isKong(m.kind)).length;
    const add = isKong(kind) ? 4 : 3;
    if (totalTiles() + add > 14 + kongs + (isKong(kind) ? 1 : 0)) return;
    state.melds.push({ kind, t, open: kind !== 'ankan' });
    render();
  }

  /* ---------------- controls ---------------- */
  $('undo').onclick = () => {
    const t = state.order.pop();
    if (t !== undefined) {
      state.counts[t]--;
      if (state.winTile === t && state.counts[t] === 0) {
        state.winTile = state.order.length ? state.order[state.order.length - 1] : null;
      }
    }
    render();
  };
  $('clear').onclick = () => {
    state.counts = new Array(34).fill(0);
    state.order = [];
    state.melds = [];
    state.winTile = null;
    state.flowers = 0;
    $('fcount').textContent = '0';
    render();
  };
  $('winMode').onclick = () => { state.pickWin = !state.pickWin; render(); };
  for (const b of document.querySelectorAll('[data-meld]')) b.onclick = () => openPicker(b.dataset.meld);
  $('fplus').onclick = () => { state.flowers = Math.min(8, state.flowers + 1); $('fcount').textContent = state.flowers; renderResult(); };
  $('fminus').onclick = () => { state.flowers = Math.max(0, state.flowers - 1); $('fcount').textContent = state.flowers; renderResult(); };
  for (const id of ['selfDraw', 'afterKong', 'lastDiscard', 'lastCopy', 'flowersOn', 'roundWind', 'seatWind']) {
    $(id).addEventListener('change', renderResult);
  }

  renderPalette();
  render();
})();
</script>
</body>
</html>
