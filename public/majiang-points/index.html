<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>国标麻将记分 · bryan.wtf</title>
<meta name="description" content="Score pad for Chinese Official mahjong: players, fan, self draw, running totals." />
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#232b36;--ink:#e6edf3;--dim:#8b949e;
    --accent:#3b82f6;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif}
  body{padding:14px 14px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:baseline;justify-content:space-between;
    gap:10px;margin:-14px -14px 10px;padding:11px 14px;background:rgba(13,17,23,.93);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.02em}
  .sub{font-size:11px;color:var(--dim)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  button.b{appearance:none;border:1px solid var(--line);background:#0f141b;color:var(--ink);
    border-radius:9px;padding:10px 12px;font-size:13px;font-family:inherit;cursor:pointer}
  button.b:active{transform:scale(.97)}
  button.b.prime{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.b.ghost{color:var(--dim)}
  button.b.on{background:rgba(59,130,246,.18);border-color:var(--accent);color:#fff;font-weight:600}
  input[type=text],input[type=number]{appearance:none;background:#0f141b;color:var(--ink);
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px;font-family:inherit;width:100%}
  input[type=number]{font-variant-numeric:tabular-nums}
  .fanrow{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;margin-top:10px}
  .fanbox{display:flex;align-items:center;justify-content:center;gap:8px;background:#0f141b;
    border:1px solid var(--accent);border-radius:12px;padding:4px 10px}
  .fanbox input{border:0;background:none;font-size:30px;font-weight:700;text-align:center;
    width:100%;padding:6px 0;color:var(--ink)}
  .fanbox input:focus{outline:none}
  .fanbox .u{font-size:14px;color:var(--dim)}
  .stepper2{appearance:none;border:1px solid var(--line);background:#0f141b;color:var(--ink);
    border-radius:12px;height:56px;font-size:22px;font-family:inherit;cursor:pointer}
  .stepper2:active{background:#1b2430}
  .segRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:4px}
  .segRow button{appearance:none;border:1px solid var(--line);background:#0f141b;color:var(--ink);
    border-radius:11px;padding:14px 8px;font-size:15px;font-family:inherit;cursor:pointer}
  .segRow button:active{transform:scale(.98)}
  .segRow button.on{background:rgba(59,130,246,.18);border-color:var(--accent);font-weight:600}
  .segRow button.dim{color:var(--dim);opacity:.55}
  #payerRow button.on{background:rgba(245,158,11,.16);border-color:var(--warn)}
  .dlg{position:fixed;inset:0;background:rgba(3,6,10,.72);display:flex;align-items:center;
    justify-content:center;padding:18px;z-index:30}
  .dlg .box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:18px}
  .dlg h2{font-size:16px;margin:0 0 6px}
  .dlg p{font-size:13px;color:var(--dim);margin:0 0 14px;line-height:1.5}
  .dlg .opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:14px;
    border:1px solid var(--line);background:#0f141b;color:var(--ink);border-radius:11px;font:inherit;cursor:pointer}
  .dlg .opt b{display:block;font-size:15px;margin-bottom:2px}
  .dlg .opt span{font-size:12px;color:var(--dim)}
  .dlg .opt.cancel{border:0;background:none;color:var(--dim);text-align:center;padding:10px}
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .seg button{appearance:none;border:1px solid var(--line);background:#0f141b;color:var(--dim);
    border-radius:9px;padding:12px 0;font-size:15px;font-family:inherit;cursor:pointer}
  .seg button.on{background:rgba(59,130,246,.16);border-color:var(--accent);color:var(--ink);font-weight:600}
  .names{display:grid;gap:8px;margin-top:4px}
  .scores{display:grid;gap:8px}
  .scoreRow{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:10px;
    padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .scoreRow:last-child{border-bottom:0}
  .scoreRow .who{font-size:15px}
  .scoreRow .num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .scoreRow .num.pos{color:var(--good)} .scoreRow .num.neg{color:var(--bad)}
  .hist{list-style:none;margin:0;padding:0;font-size:13px}
  .hist li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,.05)}
  .hist li:last-child{border-bottom:0}
  .hist .m{color:var(--dim);font-size:11px}
  .hint{font-size:11.5px;color:var(--dim);line-height:1.5;margin:6px 0 0}
  .hidden{display:none}
  .fanchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .fanchips button{appearance:none;border:1px solid var(--line);background:#0f141b;color:var(--dim);
    border-radius:8px;padding:8px 0;font-size:13px;font-family:inherit;cursor:pointer}
  .fanchips button.on{background:rgba(59,130,246,.16);border-color:var(--accent);color:#fff}
  footer{color:var(--dim);font-size:11px;text-align:center;margin-top:6px}
  a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1>国标记分</h1>
  <span class="sub" id="subline">按番数计分</span>
</header>

<section class="card" id="setupCard">
  <p class="label">开局</p>
  <div class="row" style="justify-content:space-between">
    <span class="sub">人数</span>
    <div class="seg" id="countSeg" style="grid-template-columns:repeat(3,64px)">
      <button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button>
    </div>
  </div>
  <div class="names" id="names"></div>
  <div class="row" style="margin-top:12px">
    <button class="b prime" id="startBtn">开始</button>
    <button class="b ghost" id="resumeBtn">继续上次</button>
  </div>
  <p class="hint">名字只存在这台设备的浏览器里，刷新不会丢。</p>
</section>

<section class="card hidden" id="entryCard">
  <p class="label">谁和牌</p>
  <div class="segRow" id="winnerRow"></div>
  <p class="label" style="margin:14px 0 0">点炮者</p>
  <div class="segRow" id="payerRow"></div>
  <p class="hint" id="payerHint" style="margin-top:6px">自摸时不需要选点炮者。</p>
  <div class="fanrow">
    <button class="stepper2" id="fanMinus" aria-label="减一番">−</button>
    <label class="fanbox"><input type="number" id="fan" min="8" max="300" step="1" value="8" inputmode="numeric" aria-label="番数" /><span class="u">番</span></label>
    <button class="stepper2" id="fanPlus" aria-label="加一番">+</button>
  </div>
  <p class="hint" style="margin-top:8px">直接输入任意番数，或者用下面的常用值。</p>
  <div class="fanchips" id="fanChips">
    <button data-f="8">8</button><button data-f="16">16</button>
    <button data-f="24">24</button><button data-f="32">32</button>
    <button data-f="48">48</button><button data-f="64">64</button>
    <button data-f="88">88</button><button data-f="0">清空</button>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="b" id="selfDrawBtn" style="flex:1">自摸</button>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="b prime" id="addBtn">记下</button>
    <button class="b ghost" id="undoBtn">撤销上一笔</button>
    <button class="b ghost" id="newGame">换一局</button>
  </div>
  <p class="hint" id="preview"></p>
</section>

<section class="card hidden" id="scoreCard">
  <p class="label">总分 <span class="sub" id="roundCount"></span></p>
  <div class="scores" id="scores"></div>
  <p class="hint">和牌得分就是番数。自摸时其余每家各付，点炮只由放炮那家付。</p>
</section>

<section class="card hidden" id="histCard">
  <p class="label">记录</p>
  <ul class="hist" id="hist"></ul>
</section>

<div class="dlg hidden" id="resetDlg">
  <div class="box">
    <h2>重开一局</h2>
    <p>同一批人的话，名字留着，分数清零。</p>
    <button class="opt" id="samePlayers"><b>同一批人，重新计分</b><span id="samePlayersNote">名字保留，分数清零</span></button>
    <button class="opt" id="newPlayers"><b>换人，重新开局</b><span>回到输入人数的界面</span></button>
    <button class="opt cancel" id="cancelReset">取消</button>
  </div>
</div>

<footer><a href="../majiang/">算番器</a> · <a href="https://www.bryan.wtf">bryan.wtf</a></footer>

<script>
(function () {
  const KEY = 'mj_points_v1';
  const $ = (id) => document.getElementById(id);
  const BASE = 0;   // points = fan only, no base 8

  let game = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const g = JSON.parse(raw);
      if (!g || !Array.isArray(g.players) || !g.players.length) return null;
      return g;
    } catch (e) { return null; }
  }
  function save() {
    if (game) localStorage.setItem(KEY, JSON.stringify(game));
    else localStorage.removeItem(KEY);
  }

  // ---------- setup ----------
  let setupCount = game ? game.players.length : 4;

  function paintCount() {
    for (const b of $('countSeg').querySelectorAll('button')) {
      b.classList.toggle('on', +b.dataset.n === setupCount);
    }
    paintNames();
  }

  function paintNames() {
    const box = $('names');
    const prev = Array.from(box.querySelectorAll('input')).map((i) => i.value);
    box.innerHTML = '';
    for (let i = 0; i < setupCount; i++) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = '玩家 ' + (i + 1);
      inp.value = prev[i] || (game && game.players[i] ? game.players[i].name : '');
      box.appendChild(inp);
    }
  }

  for (const b of $('countSeg').querySelectorAll('button')) {
    b.onclick = () => { setupCount = +b.dataset.n; paintCount(); };
  }

  $('startBtn').onclick = () => {
    const inputs = Array.from($('names').querySelectorAll('input'));
    const names = inputs.map((i, idx) => (i.value || '').trim() || '玩家 ' + (idx + 1));
    game = { players: names.map((n) => ({ name: n, score: 0 })), entries: [], started: Date.now() };
    save();
    render();
  };

  $('resumeBtn').onclick = () => {
    game = load();
    if (!game) { alert('没有上次的牌局'); return; }
    setupCount = game.players.length;
    render();
  };

  // ---------- entry ----------
  let winnerIdx = null;
  let payerIdx = null;
  let selfDraw = false;

  function paintWinners() {
    const row = $('winnerRow');
    row.innerHTML = '';
    game.players.forEach((p, i) => {
      const b = document.createElement('button');
      b.className = winnerIdx === i ? 'on' : '';
      b.textContent = p.name;
      b.onclick = () => {
        winnerIdx = i;
        if (payerIdx === i) payerIdx = null;
        paintWinners();
        paintPayer();
        preview();
      };
      row.appendChild(b);
    });
  }

  function paintPayer() {
    const row = $('payerRow');
    row.innerHTML = '';
    if (payerIdx === null && winnerIdx !== null) {
      const first = game.players.findIndex((p, i) => i !== winnerIdx);
      if (first >= 0) payerIdx = first;
    }
    game.players.forEach((p, i) => {
      const b = document.createElement('button');
      const isWinner = i === winnerIdx;
      b.className = (isWinner ? 'dim' : (payerIdx === i ? 'on' : ''));
      b.textContent = p.name;
      b.disabled = isWinner;
      b.onclick = () => { payerIdx = i; paintPayer(); preview(); };
      row.appendChild(b);
    });
    row.classList.toggle('hidden', selfDraw);
    $('payerRow').previousElementSibling.classList.toggle('hidden', selfDraw);
    $('payerHint').textContent = selfDraw ? '自摸时不需要选点炮者。' : '选放炮的那一家。';
  }

  function fanValue() {
    const v = parseInt($('fan').value, 10);
    return Number.isFinite(v) && v >= 8 ? v : null;
  }

  function deltas() {
    const fan = fanValue();
    if (winnerIdx === null || fan === null) return null;
    const gain = BASE + fan;
    const d = game.players.map(() => 0);
    if (selfDraw) {
      game.players.forEach((p, i) => { if (i !== winnerIdx) { d[i] = -gain; d[winnerIdx] += gain; } });
    } else {
      const payer = payerIdx;
      if (payer === null || payer === winnerIdx) return null;
      d[payer] = -gain;
      d[winnerIdx] = gain;
    }
    return d;
  }

  function preview() {
    const d = deltas();
    if (!d) { $('preview').textContent = '选赢家和番数，下面会显示这一笔怎么算。'; return; }
    const fan = fanValue();
    const gain = BASE + fan;
    const who = game.players[winnerIdx].name;
    $('preview').textContent = selfDraw
      ? who + ' 自摸 ' + fan + ' 番，每家付 ' + gain + '，共进 ' + (gain * (game.players.length - 1)) + '。'
      : who + ' 和 ' + fan + ' 番，' + game.players[payerIdx].name + ' 付 ' + gain + '。';
  }

  $('fanMinus').onclick = () => {
    const v = fanValue() === null ? 8 : fanValue();
    $('fan').value = String(Math.max(8, v - 1));
    for (const b of $('fanChips').querySelectorAll('button')) b.classList.remove('on');
    preview();
  };
  $('fanPlus').onclick = () => {
    const v = fanValue() === null ? 8 : fanValue();
    $('fan').value = String(Math.min(300, v + 1));
    for (const b of $('fanChips').querySelectorAll('button')) b.classList.remove('on');
    preview();
  };
  $('fan').addEventListener('input', () => {
    for (const b of $('fanChips').querySelectorAll('button')) b.classList.remove('on');
    preview();
  });
  for (const b of $('fanChips').querySelectorAll('button')) {
    b.onclick = () => {
      const f = +b.dataset.f;
      $('fan').value = f === 0 ? '' : String(f);
      for (const x of $('fanChips').querySelectorAll('button')) x.classList.toggle('on', x === b && f !== 0);
      preview();
    };
  }
  $('selfDrawBtn').onclick = () => {
    selfDraw = !selfDraw;
    $('selfDrawBtn').classList.toggle('on', selfDraw);
    paintPayer();
    preview();
  };


  $('addBtn').onclick = () => {
    const d = deltas();
    if (!d) { alert('先选赢家和番数'); return; }
    const fan = fanValue();
    game.entries.push({
      at: Date.now(), winner: winnerIdx, fan, selfDraw,
      payer: selfDraw ? null : payerIdx,
      deltas: d,
    });
    game.players.forEach((p, i) => { p.score += d[i]; });
    save();
    winnerIdx = null;
    payerIdx = null;
    $('fan').value = '8';
    for (const x of $('fanChips').querySelectorAll('button')) x.classList.remove('on');
    render();
  };

  $('undoBtn').onclick = () => {
    const last = game.entries.pop();
    if (!last) return;
    game.players.forEach((p, i) => { p.score -= last.deltas[i]; });
    save();
    render();
  };

  $('newGame').onclick = () => {
    $('samePlayersNote').textContent = '保留 ' + game.players.length + ' 位玩家，分数清零';
    $('resetDlg').classList.remove('hidden');
  };
  $('cancelReset').onclick = () => $('resetDlg').classList.add('hidden');
  $('resetDlg').onclick = (e) => { if (e.target.id === 'resetDlg') $('resetDlg').classList.add('hidden'); };
  $('samePlayers').onclick = () => {
    game.players.forEach((p) => { p.score = 0; });
    game.entries = [];
    game.started = Date.now();
    save();
    winnerIdx = null;
    payerIdx = null;
    $('resetDlg').classList.add('hidden');
    render();
  };
  $('newPlayers').onclick = () => {
    game = null;
    save();
    winnerIdx = null;
    payerIdx = null;
    $('resetDlg').classList.add('hidden');
    render();
  };

  // ---------- render ----------
  function render() {
    const has = !!game;
    $('setupCard').classList.toggle('hidden', has);
    $('entryCard').classList.toggle('hidden', !has);
    $('scoreCard').classList.toggle('hidden', !has);
    $('histCard').classList.toggle('hidden', !has || !game.entries.length);
    if (!has) {
      paintCount();
      $('resumeBtn').classList.toggle('hidden', !localStorage.getItem(KEY));
      return;
    }
    $('subline').textContent = game.players.length + ' 人 · ' + game.entries.length + ' 笔';
    paintWinners();
    paintPayer();
    $('selfDrawBtn').classList.toggle('on', selfDraw);

    const box = $('scores');
    box.innerHTML = '';
    const total = game.players.reduce((a, p) => a + p.score, 0);
    game.players.forEach((p) => {
      const row = document.createElement('div');
      row.className = 'scoreRow';
      row.innerHTML = '<span class="who">' + p.name + '</span>'
        + '<span class="num ' + (p.score > 0 ? 'pos' : p.score < 0 ? 'neg' : '') + '">'
        + (p.score > 0 ? '+' : '') + p.score + '</span>';
      box.appendChild(row);
    });
    const check = document.createElement('p');
    check.className = 'hint';
    check.textContent = '合计 ' + total + (total === 0 ? '，账平' : '，有人记漏了');
    box.appendChild(check);

    const hist = $('hist');
    hist.innerHTML = '';
    game.entries.slice().reverse().forEach((e, i) => {
      const li = document.createElement('li');
      const who = game.players[e.winner].name;
      const how = e.selfDraw ? '自摸' : '点炮 ' + game.players[e.payer].name;
      li.innerHTML = '<span>' + who + ' ' + e.fan + ' 番 · ' + how + '</span>'
        + '<span class="m">' + new Date(e.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</span>';
      hist.appendChild(li);
    });
    preview();
  }

  render();
})();
</script>
</body>
</html>
